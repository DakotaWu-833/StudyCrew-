# Include this file in the nginx http {} block, not inside a server {}.
# Neither query parameters nor Referer/Authorization/Cookie headers are logged.
# Recovery URLs and ICS bearer-token paths are replaced with stable labels.
map $uri $studycrew_safe_uri {
    default $uri;
    ~^/api/v1/coordination/subscriptions/feed/ /api/v1/coordination/subscriptions/feed/[redacted]/;
    ~^/help/verify/ /help/verify/[redacted]/;
    ~^/account/password/reset/ /account/password/reset/[redacted]/;
    ~^/account/recovery/ /account/recovery/[redacted]/;
    ~^/api/v1/account/.*(?:reset|recovery|token) /api/v1/account/security/[redacted]/;
}
log_format studycrew_privacy '$remote_addr [$time_local] "$request_method $studycrew_safe_uri $server_protocol" $status $body_bytes_sent $request_time';
access_log /var/log/nginx/studycrew-access.log studycrew_privacy;
# nginx error logs can contain the full request line on upstream errors. Route
# the token-bearing calendar path through a dedicated location with error_log off;
# monitor the redacted application logs and /health/ for that endpoint instead.
