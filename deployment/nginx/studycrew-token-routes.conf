# Include INSIDE the existing HTTPS server before its generic location / block.
# Existing TLS/static/protected-media rules remain in deploy/nginx/studycrew.conf.
location ^~ /api/v1/coordination/subscriptions/feed/ {
    error_log /dev/null crit;
    include uwsgi_params;
    uwsgi_pass unix:/run/studycrew/studycrew.sock;
    uwsgi_read_timeout 30s;
    uwsgi_param HTTP_X_FORWARDED_PROTO $scheme;
    uwsgi_param HTTP_X_FORWARDED_HOST $host;
    uwsgi_param HTTP_X_FORWARDED_FOR $proxy_add_x_forwarded_for;
}

# Login's next query can contain an encoded join/reset URL. Public support
# confirmation carries its bearer in the path, including failed requests.
location ~ ^/(?:help/verify/|account/(?:login/|password/reset/|recovery/)|api/v1/account/.*(?:reset|recovery)|app/campus/) {
    error_log /dev/null crit;
    include uwsgi_params;
    uwsgi_pass unix:/run/studycrew/studycrew.sock;
    uwsgi_read_timeout 30s;
    uwsgi_param HTTP_X_FORWARDED_PROTO $scheme;
    uwsgi_param HTTP_X_FORWARDED_HOST $host;
    uwsgi_param HTTP_X_FORWARDED_FOR $proxy_add_x_forwarded_for;
}
