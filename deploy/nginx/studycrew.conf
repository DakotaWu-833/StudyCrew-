server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    server_tokens off;
    return 444;
}

server {
    listen 80;
    listen [::]:80;
    server_name __DOMAIN__;
    server_tokens off;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name __DOMAIN__;
    server_tokens off;

    ssl_certificate /etc/letsencrypt/live/__DOMAIN__/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/__DOMAIN__/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:TLS:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    client_max_body_size 2m;
    merge_slashes on;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "same-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; object-src 'none'; img-src 'self' data:; font-src 'self'; style-src 'self'; script-src 'self'; connect-src 'self'" always;

    location ^~ /static/ {
        alias /srv/studycrew/app/var/static/;
        access_log off;
        expires 1h;
    }

    # Private exports are served by Nginx only after Django authorises the job.
    location ^~ /protected-media/ {
        internal;
        alias /srv/studycrew/app/var/media/;
        add_header Cache-Control "private, no-store" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "same-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
        add_header Cross-Origin-Resource-Policy "same-origin" always;
        add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none'; sandbox" always;
    }

    location ~* (?:^|/)(?:\.env|\.git|\.hg|\.svn|__pycache__|node_modules)(?:/|$) {
        return 404;
    }

    location ~* \.(?:py|pyc|sql|sqlite3?|ini|toml|ya?ml|conf|log|bak|old|swp|key|pem|crt)(?:$|/) {
        return 404;
    }

    location / {
        include uwsgi_params;
        uwsgi_pass unix:/run/studycrew/studycrew.sock;
        uwsgi_read_timeout 30s;
        uwsgi_send_timeout 30s;
        uwsgi_param HTTP_X_FORWARDED_PROTO $scheme;
        uwsgi_param HTTP_X_FORWARDED_HOST $host;
        uwsgi_param HTTP_X_FORWARDED_FOR $proxy_add_x_forwarded_for;
    }
}
