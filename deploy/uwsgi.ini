[uwsgi]
chdir = /srv/studycrew/app
module = config.wsgi:application
home = /srv/studycrew/venv

master = true
processes = 2
# Six request threads provide real headroom for the five-user marking check.
# Keeping only two processes limits the memory cost on a 1 GiB learner-lab VM.
threads = 3
enable-threads = true
thunder-lock = true
listen = 128

socket = /run/studycrew/studycrew.sock
chmod-socket = 660
chown-socket = studycrew:www-data
vacuum = true
die-on-term = true

harakiri = 30
max-requests = 1000
max-requests-delta = 100
reload-on-rss = 256
buffer-size = 16384
disable-logging = true
log-4xx = true
log-5xx = true
