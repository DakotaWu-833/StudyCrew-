          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedCommentWrite'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedCommentWrite'
      security:
      - mfaSession: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Comment'
          description: ''
    delete:
      operationId: comments_destroy
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - comments
      security:
      - mfaSession: []
      responses:
        '204':
          description: No response body
