        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - exports
      security:
      - mfaSession: []
      responses:
        '200':
          content:
            text/csv:
              schema:
                type: string
                format: binary
            application/pdf:
              schema:
                type: string
                format: binary
          description: ''
