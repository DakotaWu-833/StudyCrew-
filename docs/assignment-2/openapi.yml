          type: string
          format: uri
        title:
          type: string
          maxLength: 150
        folder:
          type: string
          maxLength: 80
        tags:
          type: array
          items:
            type: string
            maxLength: 32
          maxItems: 10
        pinned:
          type: boolean
          default: false
        expected_revision:
          type: integer
          minimum: 1
      required:
      - file
    UserSummary:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        display_name:
          type: string
          readOnly: true
      required:
      - display_name
      - id
    VoteWrite:
      type: object
      description: Reject undeclared and read-only input instead of silently ignoring
        it.
      properties:
        response:
          $ref: '#/components/schemas/VoteWriteResponseEnum'
      required:
      - response
    VoteWriteResponseEnum:
      enum:
      - 'yes'
      - maybe
      - 'no'
      type: string
      description: |-
        * `yes` - yes
        * `maybe` - maybe
        * `no` - no
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: sessionid
    mfaSession:
      type: apiKey
      in: cookie
      name: sessionid
      description: Authenticated Django session created only after password and email
        OTP. Unsafe requests also require the csrftoken cookie value in X-CSRFToken.
