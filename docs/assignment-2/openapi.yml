          description: ''
  /api/v1/meetings/:
    get:
      operationId: meetings_list
      parameters:
      - in: query
        name: page
        schema:
          type: integer
          maximum: 1000000
          minimum: 1
          default: 1
      - in: query
        name: page_size
        schema:
          type: integer
          maximum: 50
          minimum: 1
          default: 5
      - in: query
        name: project
        schema:
          type: string
          format: uuid
        required: true
      - in: query
        name: scope
        schema:
          enum:
          - active
          - archived
          - all
          type: string
          default: active
          minLength: 1
        description: |-
          * `active` - active
          * `archived` - archived
          * `all` - all
      - in: query
        name: search
        schema:
          type: string
          default: ''
          maxLength: 120
      - in: query
        name: state
        schema:
          enum:
          - all
          - scheduled
          - ended
          - cancelled
          - archived
          type: string
          default: all
          minLength: 1
        description: |-
          * `all` - all
          * `scheduled` - scheduled
          * `ended` - ended
          * `cancelled` - cancelled
          * `archived` - archived
      tags:
      - meetings
      security:
      - mfaSession: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedMeetingList'
          description: ''
    post:
      operationId: meetings_create
      tags:
      - meetings
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MeetingCreate'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/MeetingCreate'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/MeetingCreate'
        required: true
      security:
      - mfaSession: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Meeting'
          description: ''
  /api/v1/meetings/{id}/:
    get:
      operationId: meetings_retrieve
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - meetings
      security:
      - mfaSession: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Meeting'
          description: ''
    put:
      operationId: meetings_update
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - meetings
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MeetingReplace'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/MeetingReplace'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/MeetingReplace'
        required: true
      security:
      - mfaSession: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Meeting'
          description: ''
    patch:
      operationId: meetings_partial_update
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - meetings
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedMeetingWrite'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedMeetingWrite'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedMeetingWrite'
      security:
      - mfaSession: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Meeting'
          description: ''
    delete:
      operationId: meetings_destroy
      summary: Soft-archive a cancelled or ended meeting
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - meetings
      security:
      - mfaSession: []
      responses:
        '204':
          description: No response body
  /api/v1/meetings/{id}/cancel/:
