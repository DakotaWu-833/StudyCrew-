components:
  schemas:
    ActionWrite:
      type: object
      description: Reject undeclared and read-only input instead of silently ignoring
        it.
      properties:
        title:
          type: string
          maxLength: 120
          minLength: 3
        description:
          type: string
          default: ''
          maxLength: 4000
        due_at:
          type: string
          format: date-time
          nullable: true
        assignee_ids:
          type: array
          items:
            type: string
            format: uuid
          maxItems: 100
      required:
      - title
    ActivityEvent:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        project:
          type: string
          format: uuid
          readOnly: true
        actor:
          allOf:
          - $ref: '#/components/schemas/UserSummary'
          readOnly: true
        event_type:
          allOf:
          - $ref: '#/components/schemas/EventTypeEnum'
          readOnly: true
        target_type:
          allOf:
          - $ref: '#/components/schemas/TargetTypeEnum'
          readOnly: true
        target_id:
          type: string
          format: uuid
          readOnly: true
          nullable: true
        metadata:
          readOnly: true
        occurred_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - actor
      - event_type
      - id
      - metadata
      - occurred_at
      - project
      - target_id
      - target_type
    ActivityTimelineResponse:
      type: object
      properties:
        events:
          type: array
          items:
            $ref: '#/components/schemas/ActivityEvent'
          readOnly: true
        events_total:
          type: integer
          minimum: 0
          readOnly: true
        events_page:
          type: integer
          minimum: 1
          readOnly: true
        events_pages:
          type: integer
          minimum: 1
          readOnly: true
        events_page_size:
          type: integer
          minimum: 1
          readOnly: true
      required:
      - events
      - events_page
      - events_page_size
      - events_pages
      - events_total
    AdminContactsViewPage:
      type: object
      properties:
        results:
          type: array
          items:
            $ref: '#/components/schemas/Contact'
        total:
          type: integer
        page:
          type: integer
        page_size:
          type: integer
        pages:
          type: integer
      required:
      - page
      - page_size
      - pages
      - results
      - total
    AdminDeliveriesViewPage:
      type: object
      properties:
        results:
          type: array
          items:
            $ref: '#/components/schemas/Delivery'
        total:
          type: integer
        page:
          type: integer
        page_size:
          type: integer
        pages:
          type: integer
      required:
      - page
      - page_size
      - pages
      - results
      - total
    AdminTicketsViewPage:
      type: object
      properties:
        results:
          type: array
          items:
            $ref: '#/components/schemas/Ticket'
        total:
          type: integer
        page:
          type: integer
        page_size:
          type: integer
        pages:
          type: integer
      required:
      - page
      - page_size
      - pages
      - results
      - total
    AgreementInput:
      type: object
      properties:
        expected_revision:
          type: integer
          minimum: 0
        body:
          type: string
          maxLength: 6000
      required:
      - body
    Alert:
      type: object
      description: Reject undeclared and read-only input instead of silently ignoring
        it.
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        project:
          type: string
          format: uuid
          readOnly: true
        project_name:
          type: string
          readOnly: true
        category:
          type: string
          readOnly: true
        title:
          type: string
          readOnly: true
        body:
          type: string
          readOnly: true
        target_url:
          type: string
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        read_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
      required:
      - body
      - category
      - created_at
      - id
      - project
      - project_name
      - read_at
      - target_url
      - title
    AlertsViewPage:
      type: object
      properties:
        results:
          type: array
          items:
            $ref: '#/components/schemas/Alert'
        total:
          type: integer
        page:
          type: integer
        page_size:
          type: integer
        pages:
          type: integer
        count:
          type: integer
          description: Unread reminders across all pages.
      required:
      - count
      - page
      - page_size
      - pages
      - results
      - total
    ApplicationInput:
      type: object
      properties:
        message:
          type: string
          maxLength: 1500
      required:
      - message
    AssigneeUpdate:
      type: object
      description: Reject undeclared and read-only input instead of silently ignoring
        it.
      properties:
        assignee_ids:
          type: array
          items:
            type: string
            format: uuid
      required:
      - assignee_ids
    AttendanceWrite:
      type: object
      description: Reject undeclared and read-only input instead of silently ignoring
        it.
      properties:
        user_id:
          type: string
          format: uuid
        attended:
          type: boolean
        note:
          type: string
          maxLength: 500
          minLength: 1
      required:
