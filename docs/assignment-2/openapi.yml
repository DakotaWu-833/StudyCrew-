openapi: 3.0.3
info:
  title: StudyCrew REST API
  version: 1.0.0
  description: Versioned API for project, task, meeting and collaboration workflows.
paths:
  /api/v1/account/email-change/confirm/:
    post:
      operationId: account_email_change_confirm_create
      tags:
      - account
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmailChangeConfirm'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/EmailChangeConfirm'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/EmailChangeConfirm'
        required: true
      security:
      - mfaSession: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmailChangeResult'
          description: ''
  /api/v1/account/email-change/request/:
    post:
      operationId: account_email_change_request_create
      tags:
      - account
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmailChangeStart'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/EmailChangeStart'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/EmailChangeStart'
        required: true
      security:
      - mfaSession: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmailChangeStarted'
          description: ''
  /api/v1/comments/:
    get:
      operationId: comments_list
      parameters:
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
