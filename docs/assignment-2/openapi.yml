components:
  schemas:
    ActivityEvent:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        project:
          type: string
          format: uuid
          readOnly: true
        actor:
          allOf:
          - $ref: '#/components/schemas/UserSummary'
          readOnly: true
        event_type:
          allOf:
          - $ref: '#/components/schemas/EventTypeEnum'
          readOnly: true
        target_type:
          allOf:
          - $ref: '#/components/schemas/TargetTypeEnum'
          readOnly: true
        target_id:
          type: string
          format: uuid
          readOnly: true
          nullable: true
        metadata:
          readOnly: true
        occurred_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - actor
      - event_type
      - id
      - metadata
      - occurred_at
      - project
      - target_id
      - target_type
    ActivityTimelineResponse:
      type: object
      properties:
        events:
          type: array
          items:
            $ref: '#/components/schemas/ActivityEvent'
          readOnly: true
        events_total:
          type: integer
          minimum: 0
          readOnly: true
        events_page:
          type: integer
          minimum: 1
          readOnly: true
        events_pages:
          type: integer
          minimum: 1
          readOnly: true
        events_page_size:
          type: integer
          minimum: 1
          readOnly: true
      required:
      - events
      - events_page
      - events_page_size
      - events_pages
      - events_total
    AssigneeUpdate:
      type: object
      description: Reject undeclared and read-only input instead of silently discarding
        it.
      properties:
        assignee_ids:
          type: array
          items:
            type: string
            format: uuid
      required:
      - assignee_ids
    Comment:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        task:
          type: string
          format: uuid
          readOnly: true
        author:
          allOf:
          - $ref: '#/components/schemas/UserSummary'
          readOnly: true
        body:
          type: string
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        edited_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        deleted_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        is_deleted:
          type: boolean
          readOnly: true
      required:
      - author
      - body
      - created_at
      - deleted_at
      - edited_at
      - id
      - is_deleted
      - task
    CommentCreate:
      type: object
      description: Reject undeclared and read-only input instead of silently discarding
        it.
      properties:
        body:
          type: string
          maxLength: 2000
          minLength: 1
        task:
          type: string
          format: uuid
        mentioned_user_ids:
          type: array
          items:
            type: string
            format: uuid
      required:
      - body
      - task
    CommentReport:
      type: object
      description: Reject undeclared and read-only input instead of silently discarding
        it.
      properties:
        reason:
          $ref: '#/components/schemas/ReasonEnum'
        details:
          type: string
          default: ''
          maxLength: 500
      required:
      - reason
    CommentReportResult:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        status:
          type: string
          readOnly: true
          description: Current moderation state.
      required:
      - id
      - status
    CommentWrite:
      type: object
      description: Reject undeclared and read-only input instead of silently discarding
        it.
      properties:
        body:
          type: string
          maxLength: 2000
          minLength: 1
      required:
      - body
    EmailChangeConfirm:
      type: object
      description: Reject undeclared and read-only input instead of silently discarding
        it.
      properties:
        request_id:
          type: string
          format: uuid
        code:
          type: string
          writeOnly: true
          pattern: ^\d{6}$
      required:
      - code
      - request_id
    EmailChangeResult:
      type: object
      properties:
        email:
          type: string
          format: email
          readOnly: true
      required:
      - email
    EmailChangeStart:
